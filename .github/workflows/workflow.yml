# Actions 이름 github 페이지에서 볼 수 있다.
name: CI Pipeline

# Event Trigger : push / pull_request 시 CI 실행
on:
  push:
    # 배열로 여러 브랜치를 넣을 수 있다.
    branches: [ main, dev, feature/*, fix/*, workflow ]
  pull_request:
    branches:
      - main # -로 여러 브랜치를 명시하는 것도 가능
      - dev
      - workflow

jobs:
  # ===== 1. CI : 빌드 (GitHub-hosted Runner 사용) =====
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ... Java setup 및 Cache 생략 (간결화) ...
      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make executable gradlew
        run: chmod +x ./gradlew

      # 빌드 (테스트는 빠르게 하기 위해 스킵해도 됨)
      - name: Build JAR (with H2 profile)
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: ./gradlew clean build -x test

      # [핵심] JAR 파일을 아티팩트로 저장 (경로: build/libs/*.jar)
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: build/libs/*.jar
          retention-days: 1

  # ===== 2. CD : EC2 자동 배포 (Self-hosted Runner 사용) =====
  deploy:
    name: Deploy to EC2
    # [핵심] EC2 내부의 Runner 태그와 일치해야 합니다.
    runs-on: [self-hosted, linux]
    needs: build

    # [핵심] if 조건 확인: dev 또는 main 브랜치로 push가 발생했을 때만 실행
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    steps:
      # [핵심] 아티팩트 다운로드
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app
          path: /tmp/deployment/

      # 다운로드된 파일에서 JAR 파일명 찾기
      - name: Find JAR file
        id: jar
        run: |
          JAR_DIR="/tmp/deployment/spring-boot-app"
          JAR_FILE=$(ls $JAR_DIR | grep 'SNAPSHOT.jar$' | head -n 1)
          
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Jar file: $JAR_FILE"

      # [로컬 명령어] 기존 프로세스 종료
      - name: Kill existing process
        run: pkill -f 'cine-mind-0.0.1-SNAPSHOT.jar' || true

      # [로컬 명령어] JAR 복사 및 실행
      - name: Deploy and Start backend
        run: |
          # 1. 아티팩트를 서비스 경로로 복사
          cp "/tmp/deployment/spring-boot-app/${{ steps.jar.outputs.JAR_FILE }}" \
             /home/ubuntu/cine-mind-0.0.1-SNAPSHOT.jar
          
          # 2. 새 JAR 실행
          nohup java -jar /home/ubuntu/cine-mind-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=prod > app.log 2>&1 &