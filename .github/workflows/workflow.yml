name: CI Pipeline

on:
  push:
    branches: [ main, dev, feature/*, fix/*, workflow ]
  pull_request:
    branches:
      - main
      - dev
      - workflow

jobs:
  # =========================
  # 1) CI: 빌드 + 테스트
  #    - GitHub 호스트 러너에서만 수행
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make executable gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle and Run Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: ./gradlew clean build

      # 만들어진 JAR 파일 이름 찾기
      - name: Find JAR file
        id: jar
        run: |
          JAR_FILE=$(ls build/libs | grep '.jar' | head -n 1)
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Jar file: $JAR_FILE"

      # 빌드 결과물을 아티팩트로 업로드
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/${{ steps.jar.outputs.JAR_FILE }}

  # =========================
  # 2) CD: EC2 로 배포
  #    - EC2 self-hosted 러너에서 실행
  #    - 빌드는 안 하고, 위에서 만든 JAR만 사용
  # =========================
  deploy:
    name: Deploy to EC2
    runs-on: [self-hosted, linux]

    # build job 성공해야 실행
    needs: build

    # push 이면서 브랜치가 main 또는 dev 일 때만 배포
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    steps:
      # 아티팩트 다운로드 (self-hosted 러너 = EC2에서)
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ./deploy-jar

      # 기존 애플리케이션 중지 (실행 중이면)
      - name: Stop current app (if running)
        run: |
          pkill -f 'cine-mind-0.0.1-SNAPSHOT.jar' || true

      # JAR 배포 경로로 복사
      - name: Copy JAR into deploy path
        run: |
          cp ./deploy-jar/*.jar /home/ubuntu/cine-mind-0.0.1-SNAPSHOT.jar

      # 새 JAR 실행
      - name: Start app with nohup
        run: |
          nohup java -jar /home/ubuntu/cine-mind-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=prod > /home/ubuntu/app.log 2>&1 &