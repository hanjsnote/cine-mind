# Actions 이름 github 페이지에서 볼 수 있다.
name: CI Pipeline

# Event Trigger 특정 액션 (Push, Pull_Request)등이 명시한 Branch에서 일어나면 동작을 수행한다.
on:
  push:
    # 배열로 여러 브랜치를 넣을 수 있다.
    branches: [ main, dev, feature/*, fix/*, workflow]
  # github pull request 생성시
  pull_request:
    branches:
      - main # -로 여러 브랜치를 명시하는 것도 가능
      - dev
      - workflow
  # 실제 어떤 작업을 실행할지에 대한 명시
jobs:
  build:
    # 스크립트 실행 환경 (OS)
    # 배열로 선언시 개수 만큼 반복해서 실행한다.
    runs-on: [ ubuntu-latest ]

    # 실제 실행 스크립트
    steps:
      # uses는 github actions에서 제공하는 플러그인을 실행.(git checkout 실행)
      - name: checkout Code
        uses: actions/checkout@v4

      # with은 plugin 파라미터 입니다. (java 17버전 셋업)
      - name: java setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'

      # Gradle 캐시 설정 (빌드 속도 개선)
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
             ~/.gradle/caches
             ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
             ${{ runner.os }}-gradle-

      - name: Make executable gradlew
        run: chmod +x ./gradlew

        # 빌드 및 테스트 실행
      - name: Build with Gradle and Run Tests
        env:
          # H2 데이터소스 환경 변수 강제 주입 (PostgreSQL 오류 방지)
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          # KOFIC_API_KEY를 주입
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          # JWT 키 주입 (yml 환경 변수를 덮어쓴다.)
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          # clean test 대신 clean build 사용: 빌드 성공 = 컴파일 + 테스트 통과 + JAR 생성
          ./gradlew clean build
          
  # CD (자동 배포)
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs: build          # 빌드/테스트 성공해야만 실행

    # main 또는 dev 브랜치로 push 이벤트일 때 동작
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make executable gradlew
        run: chmod +x ./gradlew

      - name: Build JAR (for deploy)
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: ./gradlew clean build

      - name: Find JAR file
        id: jar
        run: |
          JAR_FILE=$(ls build/libs | grep '.jar' | head -n 1)
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Jar file: $JAR_FILE"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/cinemind.pem
          chmod 600 ~/.ssh/cinemind.pem

      - name: Copy JAR to EC2
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/cinemind.pem \
            "build/libs/${{ steps.jar.outputs.JAR_FILE }}" \
            ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/cine-mind-0.0.1-SNAPSHOT.jar

      - name: Restart backend on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/cinemind.pem ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          pkill -f 'cine-mind-0.0.1-SNAPSHOT.jar' || true
          nohup java -jar /home/ubuntu/cine-mind-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=prod > app.log 2>&1 &
          EOF