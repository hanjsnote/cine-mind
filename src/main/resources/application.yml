spring:
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# ===============================================
# 공통 외부 설정 (모든 환경에 동일하게 적용)
# ===============================================
jwt:
  secret:
    key: ${JWT_SECRET_KEY}

kofic:
  api:
    key: ${KOFIC_API_KEY}

kmdb:
  api:
    key: ${KMDB_API_KEY}

openai:
  api:
    key: ${OPENAI_API_KEY}
    # RAG 임베딩 API URL 추가 (text-embedding-3-small 모델 사용)
    embedding-url: "https://api.openai.com/v1/embeddings"
    # Chat Completion API URL 추가 (gpt-4o-mini 모델 사용)
    chat-url: "https://api.openai.com/v1/chat/completions"

rag:
  splitter:
    chunk-size: 300
    chunk-overlap: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    # ChatService가 포함된 패키지의 로그 레벨을 DEBUG로 설정
    org.cinemind: DEBUG
    org.springframework.security: DEBUG

# ===============================================
# 관리자 계정 초기화 설정
# ===============================================
admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}