server:
  port: 8080

spring:
  application:
    name: cine-mind
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_USER_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret:
    key: ${JWT_SECRET_KEY}

kofic:
  api:
    key: ${KOFIC_API_KEY}

logging:
  level:
    org.springframework.security: DEBUG