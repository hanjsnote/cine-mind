spring:
  datasource:
    # 로컬 PostgreSQL 설정
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_USER_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      # 로컬 Redis 설정
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}