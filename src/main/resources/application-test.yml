server:
  port: 8080

spring:
  application:
    name: cine-mind

  datasource:
    url: jdbc:postgresql://localhost:5432/cinemind_test
    username: root
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret:
    key: "abcdabcdabcdabcdabcdabcdabcdabcdabcdabcdabcdabcdabcd"

kofic:
  api:
    key: "test-kofic-api-key-test-kofic-api-key-test-kofic-api-key"

kmdb:
  api:
    key: "test-kmdb-api-key-test-kmdb-api-key-test-kmdb-api-key"

openai:
  api:
    key: "test-openai-api-key-test-openai-api-key-test-openai-api-key"
    # RAG 임베딩 API URL 추가 (text-embedding-3-small 모델 사용)
    embedding-url: "https://api.openai.com/v1/embeddings"
    # Chat Completion API URL 추가 (gpt-4o-mini 모델 사용)
    chat-url: "https://api.openai.com/v1/chat/completions"

logging:
  level:
    org.springframework.security: DEBUG


