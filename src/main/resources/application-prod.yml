spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # RDS 정보는 전부 환경변수로 주입
    url: jdbc:postgresql://${RDS_DB_HOST}:${RDS_DB_PORT}/${RDS_DB_NAME}
    username: ${RDS_DB_USER}
    password: ${RDS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}