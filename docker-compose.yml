version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cinemind-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server:latest
    container_name: cinemind-redis
    ports:
      - "16379:6379"   # 로컬 호스트 16379 -> 컨테이너 6379
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinemind-backend
    depends_on:
      - db
      - redis
    environment:
      # Spring 프로필
      SPRING_PROFILES_ACTIVE: local

      # JPA ddl-auto를 docker 환경에서만 create로 오버라이드
      SPRING_JPA_HIBERNATE_DDL_AUTO: create

      # DB (application-local.yml 에서 ${DB_*} 로 사용)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD}

      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      # Admin/ JWT / 외부 API 키
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      KOFIC_API_KEY: ${KOFIC_API_KEY}
      KMDB_API_KEY: ${KMDB_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    ports:
      - "8081:8080"   # 로컬 8081 -> 컨테이너 8080

volumes:
  db_data:
  redis_data: